und:var(--yellow);color:var(--navy);border-radius:50%;font-size:45px;font-weight:900}.nav{display:grid;grid-template-columns:repeat(4,1fr);height:64px;flex-shrink:0;border-top:1px solid var(--line);background:#fff}.nav button{border:0;background:none;color:#718099;font-size:10px;display:grid;place-items:center;gap:2px;padding:6px 0}.nav button span{font-size:21px}.nav button.active{color:#b28a00;font-weight:900}.dash{background:#132747;color:white;border-radius:17px;padding:15px}.dash .card{background:#243b5d;border:1px solid #37506f;color:#fff}.dash .muted{color:#d5dfec}.dashgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dashgrid button{background:#2c4465;color:#fff;border:1px solid #456080;border-radius:12px;min-height:74px;font-weight:700}.dashgrid button.on{background:#7a611a;border-color:#ffd338}.radio{display:block;padding:14px;border:1px solid #e0e7f0;border-radius:13px;margin-bottom:8px;background:#fff}.radio:has(input:checked){border-color:#edc13a;background:#fff5d3}.radio input{accent-color:#d7a900}.radio small{display:block;color:#748198;margin:4px 0 0 22px}.notice{padding:12px;border-radius:12px;background:#fff6d7;font-size:12px;line-height:1.6;color:#735b16}.testbox{border:1px solid #d2deed;background:#eef4fb;border-radius:15px;padding:13px;margin-bottom:15px}.testbox strong{font-size:13px}.testbox p{font-size:12px;line-height:1.6;margin:6px 0}.testbox .btn{margin-top:5px}.score{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.score button{border:1px solid #d9e1ed;border-radius:8px;background:#fff;min-height:45px;font-weight:900}.score button.selected{background:var(--yellow);border-color:#d8a700}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){.layout{padding:0;display:block}.intro{display:none}.phone{border:0;border-radius:0;box-shadow:none;width:100%;height:100dvh;min-height:0}.top{padding-top:max(15px,env(safe-area-inset-top))}.nav{padding-bottom:env(safe-area-inset-bottom);heig </style></head><body><div class="layout"><aside class="intro"><div class="brand"><em>●</em> 누비다 <small style="font-size:12px;letter-spacing:2px">NUBIDA</small></div><h1>골목골목,<br>일상을 누비다.</h1><p>누비다의 모바일 앱부터 차량 내 대시보드까지 이어지는 클릭형 UX 프로토타입입니다.</p><small>UT 시뮬레이션 · 실제 배차/NFC/차량 제어 없음</small></aside><div class="phone"><header class="top"><div class="status"><span>누비다 · 프로토타입</span><span>●●● ▰</span></div><div class="topbar"><h2 id="screenTitle">누비다 홈</h2><button id="utOpen" type="button">UT 모드</button></div><p class="sub" id="screenSub">나만의 이동을 시작하세요</p></header><main class="main" id="screen" aria-live="polite"><div class="card"><h3>김정숙 님, 어디로 이동하시나요?</h3><p>집에서 병원으로 이동하기</p><a href="#" class="btn">누비다 호출하기</a></div></main><nav class="nav" aria-label="주요 메뉴"><button data-nav="home" class="active"><span>⌂</span>홈</button><button data-nav="trip"><span>▤</span>내 이동</button><button data-nav="key"><span>⚿</span>디지털 키</button><button data-nav="my"><span>♙</span>마이</button></nav></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const state={page:'home',plan:'Care',dest:'OO병원',via:true,nfc:false,tv:false,rest:false,temp:24,guardian:true,help:false,from:'집',ut:false,participant:'',activeTask:null,taskStarted:0,taskActions:0,seq:0,results:[],logs:[]};
try{const saved=JSON.parse(localStorage.getItem('nubida-ut-v1')||'null');if(saved){state.participant=saved.participant||'';state.results=saved.results||[]}}catch(e){}
const titles={home:['누비다 홈','나만의 이동을 시작하세요'],route:['이동 경로 설정','목적지와 경유지를 확인해 주세요'],dispatch:['차량 배차 완료','누비다가 집 앞으로 이동하고 있어요'],key:['디지털 탑승 키','예약한 차량에만 사용할 수 있어요'],board:['탑승 인증 완료','안전하게 탑승해 주세요'],trip:['이동 현황','차량 내 화면에서 이동을 조작할 수 있어요'],dashboard:['차량 대시보드','음성·터치로 이동을 편하게'],arrive:['목적지 도착','다음 이동이 필요하신가요?'],family:['가족·보호자','함께 더 안심하고 이동하세요'],my:['구독 플랜','나에게 맞는 이동을 선택하세요'],ut:['사용성 테스트','참여자용 UT 진행 화면']};
const button=(label,action,cls='')=>`<button type="button" class="btn ${cls}" data-action="${action}">${label}</button>`;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentTask=()=>TASKS.find(t=>t.id===state.activeTask);
const TASKS=[{id:'T01',title:'차량 호출',scenario:'집에서 병원에 가야 합니다. 누비다를 이용해 이동을 준비해 주세요.',start:'home',done:'dispatch'},{id:'T02',title:'약국 경유지 추가',scenario:'병원 방문 후 약국에도 들러야 합니다. 이동 경로에 약국을 추가해 주세요.',start:'route',done:'via'},{id:'T03',title:'NFC 탑승',scenario:'예약한 차량이 도착했습니다. 차량에 탑승해 주세요.',start:'key',done:'board'},{id:'T04',title:'차량 내부 조작',scenario:'이동 중 뉴스를 보고 싶습니다. 실내 온도도 25도로 조절해 주세요.',start:'dashboard',done:'comfort'},{id:'T05',title:'차량 재호출',scenario:'병원 진료를 마쳤습니다. 집으로 돌아갈 차량을 다시 호출해 주세요.',start:'arrive',done:'recall'},{id:'T06',title:'보호자 설정',scenario:'가족의 탑승과 도착 여부를 확인할 수 있도록 알림을 설정해 주세요.',start:'family',done:'guardian'}];
function save(){try{localStorage.setItem('nubida-ut-v1',JSON.stringify({participant:state.participant,results:state.results}))}catch(e){}}
function go(page){state.page=page;render();}
function complete(marker){const t=currentTask();if(!t||t.done!==marker)return;state.pending={id:t.id,title:t.title,seconds:Math.round((Date.now()-state.taskStarted)/1000),actions:state.taskActions,success:true};state.activeTask=null;state.page='ut';render();}
function taskBar(){if(!state.activeTask)return '';const t=currentTask();return `<div class="testbox"><strong>진행 중 · ${t.id} ${t.title}</strong><p>${t.scenario}</p><button class="btn alt small" data-action="taskFail">수행 중단 / 도움 필요</button></div>`}
function page(){switch(state.page){
case 'home':return `<div class="eyebrow">NUBIDA · ${safe(state.plan)} PLAN</div><div class="hero">김정숙 님,<br>어디로 이동하시나요?</div>${taskBar()}<div class="card"><div class="field">📍 집 · 현재 위치</div><div class="field">🔎 <input id="dest" aria-label="목적지" placeholder="목적지 검색" value="${safe(state.dest)}"></div><div class="tilegrid"><button class="tile" data-action="hospital"><span>🏥</span>병원</button><button class="tile" data-action="station"><span>🚉</span>역</button><button class="tile" data-action="market"><span>🛒</span>마트</button></div></div>${button('🚐 누비다 호출하기','route')}${button('☎ 전화 예약 시나리오','route','alt')}<div class="card"><strong>다음 예약</strong><p class="muted">병원 방문 · 예약 시나리오</p></div>`;
case 'route':return `${taskBar()}<div class="card"><h3>이동 코스</h3><div class="field">🏠 출발지 · 집</div><div class="field">🏥 목적지 · ${safe(state.dest)}</div><label class="field"><input type="checkbox" id="via" ${state.via?'checked':''} style="width:22px;height:22px;accent-color:#e8b500">💊 약국 경유 추가</label><div class="field">🏠 마지막 목적지 · 집</div><div class="map">📍 ··· 🚐</div><p class="muted">예상 이동 28분 · 실제 경로 데이터 아님</p></div>${button('이 경로로 차량 호출','dispatch')}`;
case 'dispatch':return `${taskBar()}<div class="vehicle">🚐</div><div class="card center"><div class="eyebrow">배차 완료 · NB-024</div><div class="hero">내 차량이 출발했어요!</div><div class="big">3분</div><p class="muted">집 앞 지정 승차 위치로 이동 중</p><div class="map">🚐 → 🏠</div></div>${button('차량 도착 · 탑승하기','key')}`;
case 'key':return `${taskBar()}<div class="card center"><div style="font-size:75px;margin:12px">📱</div><div class="hero">NFC로 문 열기</div><p class="muted">예약한 차량 NB-024의 NFC 리더에 휴대폰을 가까이 대주세요.</p><div class="notice">김정숙 님 · ${safe(state.plan)} 탑승권<br>차량·예약 권한 확인 후 열림</div></div>${button('NFC 태그 시뮬레이션','nfc')}${button('QR 대체 인증 시뮬레이션','nfc','alt')}<p class="muted center">실제 NFC·QR 인증은 연결되지 않았습니다.</p>`;
case 'board':return `${taskBar()}<div class="success">✓</div><div class="hero center">인증 성공!<br>차량 문이 열렸어요</div><div class="card"><div class="row"><span>차량</span><b>NB-024</b></div><div class="line"></div><div class="row"><span>탑승자</span><b>김정숙 님</b></div><div class="line"></div><div class="row"><span>상태</span><b style="color:var(--green)">탑승 가능</b></div></div>${button('목적지 확인 · 출발','dashboard')}`;
case 'dashboard':return `${taskBar()}<div class="dash"><div class="row"><strong style="color:var(--yellow)">● 누비다</strong><span class="muted">자율주행 중 · 시뮬레이션</span></div><div class="dashgrid" style="margin:12px 0"><div class="card" style="margin:0"><span class="muted">병원까지</span><div style="font-size:30px;color:var(--yellow);font-weight:900">8분</div><small>${state.via?'약국 경유 예정':'직행'}</small></div><div class="card center" style="margin:0"><div style="font-size:39px">${state.tv?'📺':'🗺️'}</div><strong>${state.tv?'뉴스 재생 중':'경로 안내'}</strong></div></div><div class="dashgrid"><button data-action="tv" class="${state.tv?'on':''}">📺 ${state.tv?'TV 끄기':'뉴스 보기'}</button><button data-action="via">📍 ${state.via?'약국 경유 취소':'약국 경유 추가'}</button><button data-action="rest" class="${state.rest?'on':''}">🌙 ${state.rest?'휴식 종료':'휴식 모드'}</button><button data-action="help">🆘 도움 요청</button></div><div class="card" style="margin:12px 0 0"><div class="row"><b>🌡️ 실내 온도</b><div><button class="btn small alt" data-action="tempDown" aria-label="온도 낮추기">−</button> <b>${state.temp}°C</b> <button class="btn small alt" data-action="tempUp" aria-label="온도 높이기">＋</button></div></div></div>${state.help?'<p class="notice">상담원 연결 요청 시뮬레이션 · 실제 연결되지 않습니다.</p>':''}</div>${button('이동 현황 확인','trip','alt')}${button('목적지 도착 체험','arrive')}`;
case 'trip':return `${taskBar()}<div class="card"><div class="eyebrow">자율주행 중 · NB-024</div><div class="big">8분</div><div class="steps"><span><i></i>집</span><span><i></i>병원</span><span><i></i>약국</span><span><i></i>집</span></div></div><div class="card"><h3>차량 상태</h3><p>📺 ${state.tv?'뉴스 재생 중':'TV 꺼짐'} · 🌡️ ${state.temp}°C</p><p class="muted">차량 내부 주요 조작은 대시보드에서 제공됩니다.</p></div>${button('차량 대시보드 열기','dashboard')}${button('도착 체험','arrive','alt')}`;
case 'arrive':return `${taskBar()}<div class="success">✓</div><div class="hero center">목적지에 도착했어요!</div><div class="card center"><h3>🏥 ${safe(state.dest)}</h3><p class="muted">차량은 하차 후 인근 누비다 Zone으로 복귀합니다.</p></div>${button('🚐 지금 다시 호출하기','recall')}${button('귀가 경로 다시 설정','route','alt')}${button('보호자 알림 관리','family','alt')}`;
case 'family':return `${taskBar()}<div class="card center"><div style="font-size:49px">👵 👩</div><h3>가족과 함께 안심 이동</h3><p class="muted">보호자가 대신 호출하고 이동 상태를 확인해요.</p></div><div class="card"><div class="row"><div><strong>탑승·도착 알림</strong><p class="muted">보호자에게 상태 알림</p></div><input type="checkbox" id="guardian" ${state.guardian?'checked':''} style="width:25px;height:25px;accent-color:#d8a900" aria-label="탑승 도착 알림"></div><div class="line"></div><strong>연결된 가족</strong><p>👩 이지연 · 보호자 (시나리오)</p></div>${button('보호자 대신 차량 호출','route')}`;
case 'my':return `${taskBar()}<div class="hero">나에게 맞는 누비다</div>${[['Basic','역·정류장 중심 이동'],['Care','시니어 맞춤 · 보호자 지원'],['Flex','자유 목적지 · 경유지'],['Family','가족 공동 이용']].map(([n,d])=>`<label class="radio"><input type="radio" name="plan" value="${n}" ${state.plan===n?'checked':''}> <b>${n}</b><small>${d}</small></label>`).join('')}<div class="notice">구독·결제는 시뮬레이션이며 실제 결제되지 않습니다.</div>${button('선택 완료','home')}`;
case 'ut':return utPage();default:return '';
}}
function utPage(){const t=currentTask();if(state.pending)return `<div class="eyebrow">과업 완료 기록</div><div class="hero">${state.pending.id} ${state.pending.title}</div><div class="card"><p>소요 시간: <b>${state.pending.seconds}초</b></p><p>수행 결과: <b>${state.pending.success?'완료':'중단 / 도움 필요'}</b></p><h3>이 과업은 얼마나 쉬웠나요?</h3><p class="muted">1 매우 어려움 ~ 7 매우 쉬움</p><div class="score">${[1,2,3,4,5,6,7].map(n=>`<button class="${state.seq===n?'selected':''}" data-score="${n}" aria-label="${n}점">${n}</button>`).join('')}</div><p class="muted">점수를 선택한 후 기록을 저장하세요.</p></div>${button('과업 결과 저장','saveTask')}`;
return `<div class="card"><h3>UT 참여자 코드</h3><p class="muted">실명 대신 임의의 코드(P01 등)를 입력하세요. 결과는 이 기기에만 저장됩니다.</p><div class="field"><input id="participant" placeholder="예: P01" value="${safe(state.participant)}" maxlength="20"></div><div class="notice">개인정보를 입력하지 마세요. 기록은 서버로 자동 전송되지 않습니다. 결과 파일을 별도로 제출해야 합니다.</div></div><div class="eyebrow">테스트 과업 · ${state.results.length}건 기록</div>${TASKS.map(t=>{const done=state.results.some(r=>r.id===t.id);return `<div class="card"><div class="row"><strong>${t.id} ${t.title}</strong><span class="badge">${done?'기록됨':'미진행'}</span></div><p class="muted">${t.scenario}</p><button class="btn small ${done?'alt':''}" data-start="${t.id}">${done?'다시 테스트':'이 과업 시작'}</button></div>`}).join('')}${button('결과 CSV 다운로드','export')}${button('결과 JSON 다운로드','exportJson','alt')}${button('전체 기록 삭제','reset','danger')}`}
function render(){const [title,sub]=titles[state.page]||titles.home;$('screenTitle').textContent=title;$('screenSub').textContent=sub;$('screen').innerHTML=page();document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===state.page));$('screen').scrollTop=0;}
function act(action){if(state.activeTask)state.taskActions++;switch(action){case 'hospital':state.dest='OO병원';break;case 'station':state.dest='이대역';break;case 'market':state.dest='동네 마트';break;case 'route':if($('dest'))state.dest=$('dest').value||'OO병원';go('route');return;case 'dispatch':go('dispatch');complete('dispatch');return;case 'nfc':state.nfc=true;go('board');complete('board');return;case 'tv':state.tv=!state.tv;break;case 'via':state.via=!state.via;complete('via');break;case 'rest':state.rest=!state.rest;break;case 'help':state.help=!state.help;break;case 'tempUp':state.temp=Math.min(30,state.temp+1);break;case 'tempDown':state.temp=Math.max(16,state.temp-1);break;case 'arrive':go('arrive');return;case 'recall':state.nfc=false;go('dispatch');complete('recall');return;case 'home':case 'key':case 'trip':case 'dashboard':case 'family':case 'my':go(action);return;case 'taskFail':{const t=currentTask();state.pending={id:t.id,title:t.title,seconds:Math.round((Date.now()-state.taskStarted)/1000),actions:state.taskActions,success:false};state.activeTask=null;go('ut');return}case 'saveTask':if(!state.seq){alert('1~7점 중 하나를 선택해 주세요.');return}state.results.push({...state.pending,seq:state.seq,participant:state.participant||'익명',timestamp:new Date().toISOString()});state.pending=null;state.seq=0;save();break;case 'export':exportFile('csv');return;case 'exportJson':exportFile('json');return;case 'reset':if(confirm('저장된 UT 기록을 모두 삭제할까요?')){state.results=[];save()}break;default:break}if(state.page==='dashboard'&&state.activeTask==='T04'&&state.tv&&state.temp===25){complete('comfort');return}render();}
function exportFile(format){if(!state.results.length){alert('먼저 UT 과업을 진행해 주세요.');return}const data= format==='json'?JSON.stringify(state.results,null,2):['participant,task_id,task_title,success,seconds,actions,seq,timestamp',...state.results.map(r=>[r.participant,r.id,r.title,r.success,r.seconds,r.actions,r.seq,r.timestamp].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))].join('\r\n');const blob=new Blob(['\ufeff'+data],{type:format==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`NUBIDA_UT_${state.participant||'anonymous'}.${format}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-nav],[data-start],[data-score]');if(!el)return;if(el.dataset.nav){go(el.dataset.nav);return}if(el.dataset.score){state.seq=Number(el.dataset.score);render();return}if(el.dataset.start){const id=el.dataset.start;const t=TASKS.find(x=>x.id===id);state.participant=($('participant')?.value||state.participant||'').trim();if(!state.participant){alert('먼저 P01 같은 참여자 코드를 입력해 주세요.');return}save();state.activeTask=id;state.taskStarted=Date.now();state.taskActions=0;state.pending=null;state.seq=0;if(id==='T02')state.via=false;if(id==='T04'){state.tv=false;state.temp=24}if(id==='T06')state.guardian=false;go(t.start);return}act(el.dataset.action)});
document.addEventListener('change',e=>{if(e.target.id==='via'){state.via=e.target.checked;complete('via');if(state.page!=='ut')render()}if(e.target.id==='guardian'){state.guardian=e.target.checked;if(state.guardian)complete('guardian');if(state.page!=='ut')render()}if(e.target.name==='plan'){state.plan=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='participant'){state.participant=e.target.value.trim();save()}});
$('utOpen').addEventListener('click',()=>go('ut'));render();
})();
</script></body></html>
